<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- SandStat 유니버설/앱 링크 폴백: https://syninasoft.github.io/sandstat/join?code=XXXX
     배포 전 6819012693를 App Store Connect 앱 ID로 치환(docs/STAGE3_CHECKLIST.md). 실내 앱의 board/join 페이지와 같은 구조 -->
<title>SandStat — Join the match</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0B2430; color:#F2F6F5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         -webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:break-word; }
  .card { text-align:center; padding:40px 24px; max-width:420px; width:100%; }
  .ball { font-size:44px; }
  h1 { font-size:22px; margin:14px 0 10px; }
  .lead { color:#9DBAC2; font-size:15px; line-height:1.55; margin:0; }
  .code { display:inline-block; margin:22px 0; padding:14px 26px; border-radius:14px;
          background:#153A49; border:1.5px solid #214C5C; font-size:30px; font-weight:800;
          letter-spacing:8px; color:#FFB088; }
  a.btn { display:flex; align-items:center; justify-content:center;
          margin:10px auto; padding:15px 20px; border-radius:12px; max-width:320px;
          font-size:16px; font-weight:700; text-decoration:none; }
  .open  { background:#FF7A59; color:#1A0E0A; }
  .store { background:#153A49; color:#F2F6F5; border:1.5px solid #214C5C; }
  .hint { font-size:12.5px; color:#5F8290; line-height:1.6; margin-top:18px; }
</style>
</head>
<body>
<div class="card">
  <div class="ball">🏐</div>
  <div style="font-size:10px;letter-spacing:4px;color:#FF7A59;font-weight:800;margin-top:6px">SANDSTAT</div>
  <h1 id="t-h1">Join the SandStat match</h1>
  <p class="lead" id="t-lead">Use this invite code to watch live or co-record the match.</p>
  <div class="code" id="code">— — — —</div>
  <a class="btn open" id="openApp" href="#"><span id="t-open">Open in SandStat</span></a>
  <a class="btn store" id="storeBtn" href="https://apps.apple.com/app/id6819012693"><span id="t-store">Get it on the App Store</span></a>
  <p class="hint"><span id="t-hint1">If the app is installed, the button above opens it right away.</span><br><span id="t-hint2">If it doesn't open, enter the code in the app under Settings → Watch live.</span></p>
</div>
<script>
  // ── 브라우저 언어 감지 → 앱과 동일한 11개 언어 (미지원은 영어) ──
  var I18N = {
    ko: { h1:"SandStat 경기 참여", lead:"초대 코드로 라이브 관전 또는 공동 기록에 참여하세요.",
          open:"SandStat 앱으로 열기", store:"App Store에서 받기", play:"Google Play에서 받기",
          hint1:"앱이 설치돼 있으면 위 버튼으로 바로 열립니다.", hint2:"앱으로 안 열리면 앱의 설정 → 라이브 관전에서 코드를 직접 입력하세요." },
    en: { h1:"Join the SandStat match", lead:"Use this invite code to watch live or co-record the match.",
          open:"Open in SandStat", store:"Get it on the App Store", play:"Get it on Google Play",
          hint1:"If the app is installed, the button above opens it right away.", hint2:"If it doesn't open, enter the code in the app under Settings → Watch live." },
    ja: { h1:"SandStat 試合に参加", lead:"招待コードでライブ観戦または共同記録に参加できます。",
          open:"SandStat アプリで開く", store:"App Store で入手", play:"Google Play で入手",
          hint1:"アプリがインストール済みなら、上のボタンですぐ開きます。", hint2:"開かない場合は、アプリの設定→ライブ観戦でコードを入力してください。" },
    it: { h1:"Partecipa alla partita SandStat", lead:"Usa questo codice invito per guardare in diretta o co-registrare la partita.",
          open:"Apri in SandStat", store:"Scarica dall'App Store", play:"Scarica da Google Play",
          hint1:"Se l'app è installata, il pulsante qui sopra la apre subito.", hint2:"Se non si apre, inserisci il codice nell'app in Impostazioni → Guarda in diretta." },
    pl: { h1:"Dołącz do meczu SandStat", lead:"Użyj tego kodu zaproszenia, aby oglądać na żywo lub współrejestrować mecz.",
          open:"Otwórz w SandStat", store:"Pobierz z App Store", play:"Pobierz z Google Play",
          hint1:"Jeśli aplikacja jest zainstalowana, powyższy przycisk otworzy ją od razu.", hint2:"Jeśli się nie otwiera, wpisz kod w aplikacji: Ustawienia → Oglądaj na żywo." },
    tr: { h1:"SandStat maçına katıl", lead:"Bu davet koduyla canlı izleyin veya ortak kayda katılın.",
          open:"SandStat uygulamasında aç", store:"App Store'dan indir", play:"Google Play'den indir",
          hint1:"Uygulama yüklüyse yukarıdaki düğme hemen açar.", hint2:"Açılmazsa kodu uygulamada Ayarlar → Canlı izle bölümüne girin." },
    pt: { h1:"Participe da partida no SandStat", lead:"Use este código de convite para assistir ao vivo ou co-registrar a partida.",
          open:"Abrir no SandStat", store:"Baixar na App Store", play:"Baixar no Google Play",
          hint1:"Se o app estiver instalado, o botão acima abre na hora.", hint2:"Se não abrir, digite o código no app em Ajustes → Assistir ao vivo." },
    ru: { h1:"Присоединяйтесь к матчу SandStat", lead:"Используйте этот код приглашения, чтобы смотреть матч в прямом эфире или вести совместную запись.",
          open:"Открыть в SandStat", store:"Загрузить в App Store", play:"Скачать в Google Play",
          hint1:"Если приложение установлено, кнопка выше откроет его сразу.", hint2:"Если не открывается, введите код в приложении: Настройки → Смотреть онлайн." },
    fr: { h1:"Rejoignez le match SandStat", lead:"Utilisez ce code d'invitation pour regarder en direct ou co-enregistrer le match.",
          open:"Ouvrir dans SandStat", store:"Télécharger sur l'App Store", play:"Télécharger sur Google Play",
          hint1:"Si l'app est installée, le bouton ci-dessus l'ouvre directement.", hint2:"Si elle ne s'ouvre pas, saisissez le code dans l'app via Réglages → Regarder en direct." },
    de: { h1:"SandStat-Spiel beitreten", lead:"Mit diesem Einladungscode live zuschauen oder gemeinsam aufzeichnen.",
          open:"In SandStat öffnen", store:"Im App Store laden", play:"Bei Google Play laden",
          hint1:"Ist die App installiert, öffnet der Button oben sie direkt.", hint2:"Öffnet sie sich nicht, gib den Code in der App unter Einstellungen → Live zusehen ein." },
    es: { h1:"Únete al partido de SandStat", lead:"Usa este código de invitación para ver en vivo o co-registrar el partido.",
          open:"Abrir en SandStat", store:"Descargar en el App Store", play:"Descargar en Google Play",
          hint1:"Si la app está instalada, el botón de arriba la abre al instante.", hint2:"Si no se abre, introduce el código en la app en Ajustes → Ver en directo." }
  };
  function applyLang(tag) {
    var p = String(tag).toLowerCase().split('-')[0];
    var L = I18N[p] || I18N.en;
    document.documentElement.lang = I18N[p] ? p : 'en';
    document.title = 'SandStat — ' + L.h1;
    document.getElementById('t-h1').textContent = L.h1;
    document.getElementById('t-lead').textContent = L.lead;
    document.getElementById('t-open').textContent = L.open;
    // Android 브라우저면 Google Play 링크·문구로 (그 외는 App Store)
    var isAndroid = /Android/i.test(navigator.userAgent);
    document.getElementById('t-store').textContent = isAndroid ? (L.play || L.store) : L.store;
    document.getElementById('storeBtn').href = isAndroid
      ? 'https://play.google.com/store/apps/details?id=com.syninasoft.rallystatbeach'
      : 'https://apps.apple.com/app/id6819012693';
    document.getElementById('t-hint1').textContent = L.hint1;
    document.getElementById('t-hint2').textContent = L.hint2;
  }
  var langs = navigator.languages || [navigator.language || 'en'];
  for (var i = 0; i < langs.length; i++) {
    var p = String(langs[i]).toLowerCase().split('-')[0];
    if (I18N[p]) { applyLang(p); break; }
  }

  // ── ?code= 표시 + 앱 딥링크 구성 (영숫자만 허용) ──
  var m = (location.search.match(/[?&]code=([A-Za-z0-9]{4,12})/) || [])[1] || '';
  var code = m.toUpperCase();
  if (code) document.getElementById('code').textContent = code;
  var deep = 'sandstat://board/join' + (code ? ('?code=' + code) : '');
  document.getElementById('openApp').href = deep;
  // 진입 시 1회 자동 시도 (설치돼 있으면 앱이 열림, 없으면 이 페이지에 남음)
  setTimeout(function () { window.location.href = deep; }, 400);
</script>
</body>
</html>
